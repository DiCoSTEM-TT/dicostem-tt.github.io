{% assign text = site.data.concept_figures[page.lang] %}
{% include concept-figure-styles.html %}
<figure class="concept-figure concept-venn">
  <svg class="concept-radial" viewBox="0 0 410 392" role="group" aria-label="{{ text.heading | escape }}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="venn-left"><circle cx="136" cy="137" r="125"/></clipPath>
      <clipPath id="venn-right"><circle cx="274" cy="137" r="125"/></clipPath>
      <clipPath id="venn-bottom"><circle cx="205" cy="255" r="125"/></clipPath>
    </defs>
    {% assign areas = "136,137,90,107,#EE763A,-60|274,137,320,107,#CA3960,60|205,255,205,318,#2A7EBA,0" | split: "|" %}
    {% for area in text.areas %}
      {% assign shape = areas[forloop.index0] | split: "," %}
      <a href="#venn-dialog" class="concept-sector" aria-label="{{ area[2] | escape }}" aria-haspopup="dialog" data-title="{{ area[2] | escape }}" data-description="{{ area[3] | escape }}" style="--venn-fill: {{ shape[4] }}">
        <circle cx="{{ shape[0] }}" cy="{{ shape[1] }}" r="125"/>
        <text transform="translate({{ shape[2] }} {{ shape[3] }}) rotate({{ shape[5] }})" aria-hidden="true">
          <tspan x="0" y="-3">{{ area[0] | escape }}</tspan>
          <tspan x="0" dy="22">{{ area[1] | escape }}</tspan>
        </text>
      </a>
    {% endfor %}
    {% assign overlap_shapes = "136,137,right,top|136,137,bottom,left|274,137,bottom,right" | split: "|" %}
    {% for overlap in text.overlaps %}
      {% assign shape = overlap_shapes[forloop.index0] | split: "," %}
      <a href="#venn-dialog" class="concept-sector" aria-label="{{ overlap[0] | escape }}" aria-haspopup="dialog" data-title="{{ overlap[0] | escape }}" data-description="{{ overlap[1] | escape }}">
        <circle cx="{{ shape[0] }}" cy="{{ shape[1] }}" r="125" clip-path="url(#venn-{{ shape[2] }})" class="venn-overlap-{{ shape[3] }}"/>
      </a>
    {% endfor %}
    <g class="venn-outline" aria-hidden="true">
      <circle cx="136" cy="137" r="125"/>
      <circle cx="274" cy="137" r="125"/>
      <circle cx="205" cy="255" r="125"/>
    </g>
    <g class="venn-center" clip-path="url(#venn-left)">
      <g clip-path="url(#venn-right)">
        <a href="#venn-dialog" class="concept-sector" aria-label="{{ text.center[0] | escape }}" aria-haspopup="dialog" data-title="{{ text.center[0] | escape }}" data-description="{{ text.center[1] | escape }}">
        <circle class="venn-logo-disc" cx="205" cy="255" r="125" fill="#fff"/>
        <image class="concept-mark-light" href="{{ '/assets/img/logos/DiCoSTEM-TT.svg' | relative_url }}" x="165" y="140" width="80" height="80"/>
        <image class="concept-mark-dark" href="{{ '/assets/img/logos/DiCoSTEM-TT_N.svg' | relative_url }}" x="165" y="140" width="80" height="80"/>
        </a>
      </g>
    </g>
  </svg>
  <figcaption>{{ text.instruction | escape }}</figcaption>
  <div class="venn-tooltip" role="tooltip" hidden><strong></strong><p></p></div>
  <dialog id="venn-dialog" aria-labelledby="venn-dialog-title" aria-describedby="venn-dialog-description">
    <h3 id="venn-dialog-title"></h3>
    <p id="venn-dialog-description"></p>
    <form method="dialog"><button type="submit">{{ text.close | escape }}</button></form>
  </dialog>
</figure>
<script src="{{ '/assets/js/project-venn.js' | relative_url }}" defer></script>
