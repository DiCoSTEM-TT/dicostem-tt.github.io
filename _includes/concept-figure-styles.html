<style>
.concept-figure {
  width: min(100%, 35rem);
  margin: 1.5rem auto 0;
  --sector: #234b67;
  --sector-active: #1b6470;
}

.concept-radial {
  display: block;
  width: 100%;
  height: auto;
  font-family: inherit;
}

.concept-frame {
  fill: color-mix(in srgb, var(--bg) 92%, var(--brand));
  stroke: var(--sector);
  stroke-width: 2;
  stroke-dasharray: 8 6;
}

.concept-field {
  fill: color-mix(in srgb, var(--bg) 85%, var(--brand));
  stroke: color-mix(in srgb, var(--bg) 55%, var(--brand));
  stroke-width: 2;
}

.concept-hub {
  fill: var(--sector-active);
  stroke: var(--sector);
  stroke-width: 2;
}

.concept-logo-disc {
  fill: #fff;
  stroke: var(--sector);
  stroke-width: 2;
}

.concept-title,
.concept-label {
  fill: var(--text);
  text-anchor: middle;
  font-weight: 600;
}

.concept-title {
  font-size: 24px;
  paint-order: stroke fill;
  stroke: color-mix(in srgb, var(--bg) 92%, var(--brand));
  stroke-width: 9px;
  stroke-linejoin: round;
}

.concept-label {
  font-size: 20px;
}

.concept-sector {
  cursor: pointer;
}

.concept-sector-shape {
  fill: var(--sector);
  stroke: var(--brand);
  stroke-width: 1.5;
}

.concept-symbol {
  fill: none;
  stroke: #b8efeb;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.concept-sector:hover .concept-sector-shape,
.concept-sector:focus-visible .concept-sector-shape {
  fill: var(--sector-active);
  stroke-width: 4;
}

.concept-sector:focus-visible .concept-label {
  text-decoration: underline;
}

.concept-figure figcaption {
  text-align: center;
  margin-top: .6rem;
  color: var(--muted);
  font-size: .9rem;
}

.concept-figure dialog {
  width: min(28rem, calc(100% - 2rem));
  padding: 1.4rem;
  color: var(--text);
  background: var(--bg);
  border: 2px solid var(--brand);
  border-radius: var(--radius);
}

.concept-figure dialog::backdrop {
  background: rgb(0 0 0 / 50%);
}

.concept-figure dialog h3 {
  margin-top: 0;
}

.concept-figure dialog button {
  padding: .35rem .85rem;
  color: var(--text);
  background: color-mix(in srgb, var(--bg) 85%, var(--brand));
  border: 1px solid var(--brand);
  border-radius: .4rem;
  font: inherit;
  cursor: pointer;
}

.concept-disclosure { position: relative; }
.concept-disclosure > summary {
  display: grid;
  place-items: center;
  position: relative;
  margin-inline: auto;
  width: 5rem;
  aspect-ratio: 1;
  list-style: none;
  border: 2px solid var(--brand);
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
.concept-disclosure > summary::-webkit-details-marker { display: none; }
.concept-disclosure > summary img { width: 82%; }
.concept-disclosure > summary::after {
  content: "+";
  position: absolute;
  right: -.25rem;
  bottom: -.15rem;
  display: grid;
  place-items: center;
  width: 1.25rem;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--sector-active);
  color: #fff;
  font-weight: 700;
  line-height: 1;
}
.concept-disclosure > summary:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
.concept-disclosure[open] > summary {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 51.55%;
  width: 14.84%;
  transform: translate(-50%, -50%);
  border-color: transparent;
  background: transparent;
}
.concept-disclosure[open] > summary img { visibility: hidden; }
.concept-disclosure[open] > summary::after { content: "−"; }
.concept-disclosure:not([open]) + figcaption { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .concept-disclosure[open] .concept-sector {
    --step: 60ms;
    transform-box: view-box;
    transform-origin: 50% 51.55%;
    animation: concept-unfold 360ms cubic-bezier(.18,.72,.28,1) calc(var(--index) * var(--step)) both;
  }
  .concept-disclosure .concept-sector:nth-of-type(1) { --index: 0; }
  .concept-disclosure .concept-sector:nth-of-type(2) { --index: 1; }
  .concept-disclosure .concept-sector:nth-of-type(3) { --index: 2; }
  .concept-disclosure .concept-sector:nth-of-type(4) { --index: 3; }
  .concept-disclosure .concept-sector:nth-of-type(5) { --index: 4; }
  .concept-disclosure .concept-sector:nth-of-type(6) { --index: 5; }
  .concept-disclosure .concept-sector:nth-of-type(7) { --index: 6; }
  .concept-disclosure .concept-sector:nth-of-type(8) { --index: 7; }

  .concept-disclosure[open].is-folding .concept-sector {
    animation: concept-fold 330ms cubic-bezier(.5,0,.72,.5) calc((7 - var(--index)) * var(--step)) both;
  }

  .concept-disclosure[open] :is(.concept-frame, .concept-field, .concept-title) {
    animation: concept-fade-in 280ms ease-out both;
  }
  .concept-disclosure[open].is-folding :is(.concept-frame, .concept-field, .concept-title) {
    animation: concept-fade-out 280ms ease-in 430ms both;
  }
}
@keyframes concept-unfold {
  from { opacity: 0; transform: scale(.18); }
}
@keyframes concept-fold {
  to { opacity: 0; transform: scale(.18); }
}
@keyframes concept-fade-in {
  from { opacity: 0; }
}
@keyframes concept-fade-out {
  to { opacity: 0; }
}
.concept-disclosure .concept-sector:nth-of-type(1) { --point: #2a7eba; }
.concept-disclosure .concept-sector:nth-of-type(2) { --point: #5a3f8b; }
.concept-disclosure .concept-sector:nth-of-type(3) { --point: #923c76; }
.concept-disclosure .concept-sector:nth-of-type(4) { --point: #ca3960; }
.concept-disclosure .concept-sector:nth-of-type(5) { --point: #ee763a; }
.concept-disclosure .concept-sector:nth-of-type(6) { --point: #8f8b46; }
.concept-disclosure .concept-sector:nth-of-type(7) { --point: #309f52; }
.concept-disclosure .concept-sector:nth-of-type(8) { --point: #00a59f; }

.concept-disclosure .concept-sector-shape {
  fill: color-mix(in srgb, var(--point) 34%, white);
  stroke: color-mix(in srgb, var(--point) 72%, var(--text));
}

.concept-disclosure .concept-symbol {
  stroke: #182733;
}

[data-theme="dark"] .concept-disclosure .concept-sector-shape {
  fill: var(--point);
  stroke: color-mix(in srgb, var(--point) 70%, var(--text));
}

[data-theme="dark"] .concept-disclosure .concept-symbol {
  stroke: #fff;
  filter: drop-shadow(0 0 1px #17212b);
}

.concept-disclosure .concept-sector:is(:hover, :focus-visible) .concept-sector-shape {
  stroke: var(--text);
}

.concept-venn { width: min(100%, 28rem); margin-block: 1rem 1.35rem; }
.concept-venn .concept-sector circle {
  fill: var(--venn-fill);
  transition: fill 180ms ease;
}
.concept-venn .concept-sector:is(:hover, :focus-visible) circle { fill: #087f87; }
.concept-venn .concept-sector:focus-visible text { text-decoration: underline; }
.concept-venn .concept-sector text {
  fill: #fff;
  text-anchor: middle;
  font-size: 18px;
  font-weight: 700;
  pointer-events: none;
}
.concept-venn .venn-outline { fill: none; stroke: var(--bg); stroke-width: 5; pointer-events: none; }
.concept-venn .venn-center { pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .concept-venn .concept-sector circle { transition: none; }
}
</style>
