<style>
.team-avatars {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(.65rem, 1.8vw, 1rem);
  align-items: start;
}
.team-avatar-lead { display: contents; }
@media (max-width: 960px) {
  .team-avatar-lead {
    display: flex;
    flex-basis: 100%;
    justify-content: center;
  }
}
.team-avatar {
  display: block;
  padding: 0;
  flex: 0 1 auto;
  width: clamp(7rem, 11vw, 8.5rem);
  max-width: 100%;
  border: 0;
  border-radius: .85rem;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: clamp(.75rem, 1.6vw, .92rem);
  font-weight: 600;
  line-height: 1.15;
  cursor: pointer;
}
.team-avatar img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  box-sizing: border-box;
  border: 2px solid transparent;
  object-fit: cover;
  border-radius: .7rem;
}
.team-avatar-name {
  display: block;
  margin-top: .3rem;
  overflow-wrap: anywhere;
}
.team-avatar-name span { display: block; }
.team-avatar:hover img,
.team-avatar[aria-expanded="true"] img { border-color: var(--avatar-accent, var(--brand)); }
.team-avatar:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.team.team-disclosure { gap: 0; }
.team-avatar-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 280ms ease;
}
.team-avatar-panel.is-open { grid-template-rows: 1fr; }
.team-avatar-content { min-height: 0; overflow: hidden; }
.team-avatar-content > .team-card {
  max-width: 34rem;
  margin: 1.1rem auto 0;
}
.team-avatar-content > .team-card[hidden] { display: none; }
.team-avatar-content .team-photo { max-width: 14rem; align-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .team-avatar img {
    transition: transform 260ms ease-out;
  }
  .team-avatar.is-pointer-over img {
    position: relative;
    z-index: 1;
    transform: scale(1.12);
    animation: team-portrait-wobble 650ms ease-in-out;
  }
}
@keyframes team-portrait-wobble {
  0% { transform: scale(1) rotate(0deg); }
  26% { transform: scale(1.12) rotate(-4deg); }
  52% { transform: scale(1.12) rotate(3deg); }
  75% { transform: scale(1.12) rotate(-1.5deg); }
  100% { transform: scale(1.12) rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .team-avatar-panel { transition: none; }
}
.team-profile-links {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
}
.team-profile-links a {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .28rem .5rem;
  border: 1px solid color-mix(in srgb, var(--brand) 40%, var(--bg));
  border-radius: .5rem;
}
.team-profile-links img {
  display: block;
  width: 1.5rem;
  height: 1.5rem;
  object-fit: contain;
  background: #fff;
  border-radius: .2rem;
}
</style>
<script src="{{ '/assets/js/team-disclosure.js?v=lead-scroll' | relative_url }}" defer></script>
