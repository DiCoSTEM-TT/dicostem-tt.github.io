<style>
.team-avatars {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: clamp(.65rem, 1.8vw, 1rem);
  align-items: start;
}
.team-avatar {
  display: block;
  padding: 0;
  min-width: 0;
  border: 0;
  border-radius: .85rem;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: clamp(.75rem, 1.6vw, .92rem);
  font-weight: 600;
  line-height: 1.15;
  cursor: pointer;
}
.team-avatar img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  box-sizing: border-box;
  border: 2px solid transparent;
  object-fit: cover;
  border-radius: .7rem;
}
.team-avatar-name {
  display: block;
  margin-top: .3rem;
  overflow-wrap: anywhere;
}
.team-avatar:hover img,
.team-avatar[aria-expanded="true"] img { border-color: var(--brand); }
.team-avatar:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.team.team-disclosure { gap: 0; }
.team-avatar-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 280ms ease;
}
.team-avatar-panel.is-open { grid-template-rows: 1fr; }
.team-avatar-content { min-height: 0; overflow: hidden; }
.team-avatar-content > .team-card {
  max-width: 34rem;
  margin: 1.1rem auto 0;
}
.team-avatar-content > .team-card[hidden] { display: none; }
.team-avatar-content .team-photo { max-width: 14rem; align-self: center; }
@media (max-width: 640px) {
  .team-avatars { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .team-avatar-panel { transition: none; }
}
</style>
