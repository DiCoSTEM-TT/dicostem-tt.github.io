title: "DiCoSTEM-TT"
description: "Competencia Digital y Educación STEM en la Formación del Profesorado"
claim:
  es: "Competencia Digital y Educación STEM en la Formación del Profesorado"
  en: "Digital Competence and STEM Education in Teacher Training"
  pt: "Competência Digital e Educação STEM na Formação de Professores"
url: "https://dicostem-tt.github.io"
baseurl: ""  # keep empty for organization/user pages
lang: es
languages: ["es","en","pt"]
timezone: Europe/Madrid

theme: null
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

collections:
  posts:
    output: true

defaults:
  - scope: { path: "" }
    values: { layout: "page", image: "/assets/img/social-card-v7.png" }
  - scope: { path: "en" }
    values: { lang: "en" }
  - scope: { path: "es" }
    values: { lang: "es" }
  - scope: { path: "pt" }
    values: { lang: "pt", locale: "pt_PT", description: "Competência Digital e Educação STEM na Formação de Professores" }


exclude:
  - "README.md"
  - "node_modules"
  - "package.json"
  - "package-lock.json"

permalink: pretty

# SEO & social
social:
  name: "DiCoSTEM-TT"
  links: []
